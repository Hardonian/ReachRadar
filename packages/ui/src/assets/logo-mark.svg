<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer radar ring -->
  <circle cx="24" cy="24" r="21" stroke="#00F29D" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Middle radar ring -->
  <circle cx="24" cy="24" r="14" stroke="#00F29D" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Inner core pulse -->
  <circle cx="24" cy="24" r="7" fill="#00F29D" fill-opacity="0.9"/>
  <!-- Radar sweep arc / signal pulse -->
  <path d="M24 24 L39 9 A21 21 0 0 1 45 24 Z" fill="url(#radar-sweep-grad)" fill-opacity="0.4"/>
  <!-- Reticle crosshairs -->
  <line x1="24" y1="3" x2="24" y2="7" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="24" y2="45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="3" y1="24" x2="7" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="45" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="radar-sweep-grad" x1="24" y1="24" x2="45" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F29D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
